<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <link rel="icon" type="image/png" href="/icon.png" />
    <title>FamilyNotes</title>
    <script>
      try {
        const s = localStorage.getItem("familynotes_ui_scale");
        if (s && ["normal", "large", "xlarge"].includes(s)) {
          document.documentElement.setAttribute("data-ui-scale", s);
        }
        const t = localStorage.getItem("familynotes_theme");
        if (t === "dark" || (!t && window.matchMedia("(prefers-color-scheme: dark)").matches)) {
          document.documentElement.classList.add("dark");
        }
      } catch(e) {}
    </script>
  </head>
  <body class="bg-slate-950 text-slate-100 antialiased select-none overflow-hidden">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
